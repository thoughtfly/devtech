name: 🤖 Auto Blog - Generate & Deploy

on:
  schedule:
    # Run daily at 08:00 UTC (16:00 CST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of posts to generate'
        required: true
        default: '1'
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Single job: generate -> build -> deploy in the same workspace.
# This guarantees freshly generated posts are included in the build
# (a separate build job would checkout the pre-generate commit and miss them).
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate blog posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          COUNT="${{ inputs.count || '1' }}"
          python generator/generate_posts.py --count "$COUNT"

      - name: Commit new posts
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "devtech-bot"
            git config user.email "bot@devtech-blog.com"
            git add source/_posts/ generator/.topic_history.json
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M UTC")
            git commit -m "auto: generate blog posts - ${TIMESTAMP}"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hexo dependencies
        run: |
          npm install

      - name: Build static site
        run: |
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
